   # 코드를 올리거나 Pull Request를 만들 때마다 GitHub이 자동으로 검산한다.
   # 결과는 저장소의 [Actions] 탭에서 볼 수 있다 (초록 체크 = 통과, 빨간 X = 실패).
   name: 검산
   on:
     push:
     pull_request:
   jobs:
     test:
       runs-on: ubuntu-latest
       timeout-minutes: 20
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@v4
           with:
             node-version: 20
         - name: 예제 + 무작위 비정형 평면 12개 검산
           run: node tests/run.js
